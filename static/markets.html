<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSage AI - Markets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#f0f2ff;font-family:'Inter',system-ui,sans-serif;height:100vh;overflow:hidden}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#1a1d27;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.topbar-logo{font-size:16px;font-weight:700;color:white}
.topbar-tag{font-size:12px;color:#5a5f75}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#1a1d27;border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:100}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#5a5f75;text-decoration:none;transition:color .15s}
.bottomnav a.active{color:#6c63ff}
.main{position:fixed;top:52px;bottom:60px;left:0;right:0;overflow-y:auto;padding:24px 32px;background:#0f1117}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:600;color:#6c63ff;letter-spacing:2px;text-transform:uppercase}
.heading{font-size:32px;font-weight:800;color:white;letter-spacing:-0.5px;margin-top:6px;text-shadow:0 0 60px rgba(108,99,255,0.3)}
.subtext{font-size:14px;color:#5a5f75;margin-top:4px}
.market-tools{display:flex;flex-direction:column;align-items:flex-end;gap:14px;min-width:420px}
.market-toggle{display:flex;gap:8px;flex-wrap:wrap}
.toggle-btn{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#5a5f75;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',system-ui,sans-serif;transition:all .15s}
.toggle-btn.active{background:#6c63ff;border-color:#6c63ff;color:white}
.search-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;width:100%}
.indices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.index-card,.stock-row,.sentiment-card{background:#1a1d27;border:1px solid rgba(255,255,255,0.06)}
.index-card{border-radius:14px;padding:18px}
.index-name{font-size:12px;color:#5a5f75;font-weight:500}
.index-value{font-size:24px;font-weight:800;color:white;margin-top:4px}
.index-change{font-size:13px;font-weight:600;margin-top:6px}
.positive{color:#22c55e}
.negative{color:#ef4444}
.sparkline{height:6px;border-radius:99px;background:rgba(255,255,255,0.06);margin-top:14px;overflow:hidden}
.sparkline-fill{height:100%;border-radius:99px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.section-label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.section-label.gainers{color:#22c55e}
.section-label.losers{color:#ef4444}
.section-label.sentiment{color:#6c63ff;margin-bottom:16px}
.stock-row{border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;transition:all .15s}
.stock-row:hover{background:rgba(108,99,255,0.08);border-color:rgba(108,99,255,0.28);transform:translateY(-1px)}
.stock-name{font-size:13px;font-weight:600;color:white}
.stock-exchange{font-size:10px;color:#5a5f75;margin-top:3px}
.stock-price{font-size:13px;font-weight:600;color:white;text-align:right}
.stock-change{font-size:12px;font-weight:600;margin-top:3px;text-align:right}
.sentiment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sentiment-card{border-radius:12px;padding:16px;text-align:center}
.sentiment-num{font-size:28px;font-weight:800}
.sentiment-title{font-size:12px;color:#5a5f75;margin-top:6px}
.timestamp{margin-top:24px;font-size:12px;color:#5a5f75}
@media(max-width:1100px){
  .header-row{flex-direction:column}
  .market-tools{min-width:0;align-items:flex-start;width:100%}
}
@media(max-width:980px){
  .indices{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
}
@media(max-width:720px){
  .main{padding:20px 16px}
  .indices{grid-template-columns:1fr}
  .sentiment-grid{grid-template-columns:1fr}
  .heading{font-size:28px}
  .search-row{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-logo">StockSage AI</span>
  <span class="topbar-tag">Markets</span>
  <button onclick="logout()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#8b90a7;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s" onmouseover="this.style.color='white'" onmouseout="this.style.color='#8b90a7'">Sign out</button>
</div>

<div class="main">
  <div class="header-row">
    <div>
      <div class="eyebrow">LIVE MARKETS</div>
      <div class="heading">Market Overview</div>
      <div class="subtext">Live indices, top movers, and market sentiment - updated in real time.</div>
    </div>
    <div class="market-tools">
      <div class="market-toggle">
        <button id="toggle-india" class="toggle-btn active" onclick="switchMarket('india')">🇮🇳 India</button>
        <button id="toggle-us" class="toggle-btn" onclick="switchMarket('us')">🇺🇸 US</button>
      </div>
      <div class="search-row">
        <input id="stock-search" type="text" placeholder="Search any stock... e.g. HDFC, AAPL" style="flex:1;background:#1a1d27;color:white;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 16px;font-size:13px;outline:none;font-family:'Inter',sans-serif;max-width:400px" onkeydown="if(event.key==='Enter')searchStock()" />
        <button onclick="searchStock()" style="background:#6c63ff;color:white;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">Search</button>
      </div>
    </div>
  </div>

  <div class="indices" id="indices"></div>

  <div class="two-col">
    <div>
      <div class="section-label gainers">TOP GAINERS</div>
      <div id="gainers-list"></div>
    </div>
    <div>
      <div class="section-label losers">TOP LOSERS</div>
      <div id="losers-list"></div>
    </div>
  </div>

  <div>
    <div class="section-label sentiment">MARKET SENTIMENT</div>
    <div class="sentiment-grid" id="sentiment-grid"></div>
  </div>

  <div class="timestamp">LAST UPDATED: <span id="last-updated">--</span></div>
</div>

<div class="bottomnav">
  <a href="/chat">📊<span>Research</span></a>
  <a href="/budget">💼<span>Budget</span></a>
  <a href="/news">📰<span>News</span></a>
  <a href="/markets" class="active">📈<span>Markets</span></a>
  <a href="/assistant">🤖<span>Assistant</span></a>
  <a href="/profile">👤<span>Profile</span></a>
</div>

<script>
const INDEX_DATA = [
  {name:'NIFTY 50', value:'24,853.15', change:'+461.35', pct:'+1.89%', positive:true},
  {name:'SENSEX', value:'81,721.08', change:'+1,525.38', pct:'+1.90%', positive:true},
  {name:'S&P 500', value:'5,842.47', change:'+23.11', pct:'+0.40%', positive:true},
  {name:'NASDAQ', value:'19,215.46', change:'+87.23', pct:'+0.46%', positive:true}
];

const INDIA_GAINERS = [
  {name:'Adani Ports', symbol:'ADANIPORTS', exchange:'NSE', price:'₹1,284.50', change:'+4.82%'},
  {name:'NTPC', symbol:'NTPC', exchange:'NSE', price:'₹387.20', change:'+3.91%'},
  {name:'Bajaj Finance', symbol:'BAJFINANCE', exchange:'NSE', price:'₹7,124.00', change:'+3.45%'},
  {name:'ITC', symbol:'ITC', exchange:'NSE', price:'₹478.30', change:'+2.87%'},
  {name:'Sun Pharma', symbol:'SUNPHARMA', exchange:'NSE', price:'₹1,892.40', change:'+2.64%'}
];

const INDIA_LOSERS = [
  {name:'Wipro', symbol:'WIPRO', exchange:'NSE', price:'₹298.45', change:'-2.31%'},
  {name:'Tech Mahindra', symbol:'TECHM', exchange:'NSE', price:'₹1,423.60', change:'-1.98%'},
  {name:'Hindustan Unilever', symbol:'HINDUNILVR', exchange:'NSE', price:'₹2,287.00', change:'-1.45%'},
  {name:'Nestle India', symbol:'NESTLEIND', exchange:'NSE', price:'₹2,134.50', change:'-1.23%'},
  {name:'Dr Reddys', symbol:'DRREDDY', exchange:'NSE', price:'₹6,892.00', change:'-0.98%'}
];

const US_GAINERS = [
  {name:'NVIDIA', symbol:'NVDA', exchange:'NASDAQ', price:'$131.38', change:'+4.21%'},
  {name:'Meta', symbol:'META', exchange:'NASDAQ', price:'$612.45', change:'+2.87%'},
  {name:'Amazon', symbol:'AMZN', exchange:'NASDAQ', price:'$198.32', change:'+2.14%'},
  {name:'Apple', symbol:'AAPL', exchange:'NASDAQ', price:'$211.16', change:'+1.89%'},
  {name:'Microsoft', symbol:'MSFT', exchange:'NASDAQ', price:'$441.82', change:'+1.43%'}
];

const US_LOSERS = [
  {name:'Boeing', symbol:'BA', exchange:'NYSE', price:'$172.34', change:'-2.87%'},
  {name:'Walt Disney', symbol:'DIS', exchange:'NYSE', price:'$88.42', change:'-1.94%'},
  {name:'Pfizer', symbol:'PFE', exchange:'NYSE', price:'$27.83', change:'-1.67%'},
  {name:'Intel', symbol:'INTC', exchange:'NASDAQ', price:'$21.45', change:'-1.43%'},
  {name:'Ford', symbol:'F', exchange:'NYSE', price:'$11.28', change:'-1.12%'}
];

const SENTIMENT = [
  {label:'Bullish', value:'58%', color:'#22c55e'},
  {label:'Neutral', value:'24%', color:'#f59e0b'},
  {label:'Bearish', value:'18%', color:'#ef4444'}
];

async function checkAuth(){
  try{
    const res = await fetch('/api/auth/me');
    if(!res.ok){ window.location.href='/login'; return null; }
    return await res.json();
  }catch(e){ window.location.href='/login'; return null; }
}

async function logout(){
  await fetch('/api/auth/logout', {method:'POST'});
  window.location.href='/login';
}

function renderIndices(){
  document.getElementById('indices').innerHTML = INDEX_DATA.map(index => `
    <div class="index-card">
      <div class="index-name">${index.name}</div>
      <div class="index-value">${index.value}</div>
      <div class="index-change ${index.positive ? 'positive' : 'negative'}">${index.change} (${index.pct})</div>
      <div class="sparkline">
        <div class="sparkline-fill index-bar" style="width:${index.positive ? '78%' : '36%'};background:${index.positive ? '#22c55e' : '#ef4444'}"></div>
      </div>
    </div>
  `).join('');
}

async function loadIndices(){
  try{
    const res = await fetch('/api/market-indices');
    const data = await res.json();
    if(data.success && Object.keys(data.indices).length > 0){
      const indices = data.indices;
      const cards = document.querySelectorAll('.index-card');
      const names = ['NIFTY 50', 'SENSEX', 'S&P 500', 'NASDAQ'];
      names.forEach((name, i) => {
        if(indices[name] && cards[i]){
          const valueEl = cards[i].querySelector('.index-value');
          const changeEl = cards[i].querySelector('.index-change');
          const barEl = cards[i].querySelector('.index-bar');
          if(valueEl) valueEl.textContent = indices[name].price;
          if(changeEl){
            changeEl.textContent = indices[name].change_pct;
            changeEl.style.color = indices[name].is_positive ? '#22c55e' : '#ef4444';
          }
          if(barEl) barEl.style.background = indices[name].is_positive ? '#22c55e' : '#ef4444';
        }
      });
    }
  }catch(e){
    console.log('Indices load failed:', e);
  }
}

function openStock(stock){
  const name = encodeURIComponent(stock.name);
  window.location.href = `/stock-detail?symbol=${encodeURIComponent(stock.symbol)}&exchange=${encodeURIComponent(stock.exchange)}&name=${name}`;
}

function renderStocks(listId, stocks, positive){
  document.getElementById(listId).innerHTML = stocks.map(stock => `
    <div class="stock-row" onclick='openStock(${JSON.stringify(stock)})'>
      <div>
        <div class="stock-name">${stock.name}</div>
        <div class="stock-exchange">${stock.exchange}</div>
      </div>
      <div>
        <div class="stock-price">${stock.price}</div>
        <div class="stock-change ${positive ? 'positive' : 'negative'}">${stock.change}</div>
      </div>
    </div>
  `).join('');
}

function renderSentiment(){
  document.getElementById('sentiment-grid').innerHTML = SENTIMENT.map(item => `
    <div class="sentiment-card">
      <div class="sentiment-num" style="color:${item.color}">${item.value}</div>
      <div class="sentiment-title">${item.label}</div>
    </div>
  `).join('');
}

function switchMarket(market){
  const indiaBtn = document.getElementById('toggle-india');
  const usBtn = document.getElementById('toggle-us');
  if(market === 'us'){
    indiaBtn.classList.remove('active');
    usBtn.classList.add('active');
    renderStocks('gainers-list', US_GAINERS, true);
    renderStocks('losers-list', US_LOSERS, false);
  } else {
    usBtn.classList.remove('active');
    indiaBtn.classList.add('active');
    renderStocks('gainers-list', INDIA_GAINERS, true);
    renderStocks('losers-list', INDIA_LOSERS, false);
  }
}

function searchStock(){
  const query = document.getElementById('stock-search').value.trim();
  if(!query) return;
  const isUS = ['AAPL','TSLA','NVDA','MSFT','GOOGL','AMZN','META','NFLX','AMZN'].includes(query.toUpperCase());
  const exchange = isUS ? 'NASDAQ' : 'NSE';
  window.location.href = `/stock-detail?symbol=${query.toUpperCase()}&exchange=${exchange}&name=${query.toUpperCase()}`;
}

function updateTimestamp(){
  const now = new Date();
  document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-IN', {
    hour:'2-digit',
    minute:'2-digit'
  });
}

checkAuth().then(user => {
  if(!user) return;
  renderIndices();
  loadIndices();
  renderSentiment();
  switchMarket('india');
  updateTimestamp();
  setInterval(updateTimestamp, 60000);
});
</script>
</body>
</html>

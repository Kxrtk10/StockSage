<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSage AI - Market News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#f0f2ff;font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#1a1d27;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.topbar-logo{font-size:16px;font-weight:700;color:white}
.topbar-tag{font-size:12px;color:#5a5f75}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#1a1d27;border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:100}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#5a5f75;text-decoration:none;transition:color .15s}
.bottomnav a.active{color:#6c63ff}
.bottomnav .icon{font-size:16px;line-height:1}
.main{position:fixed;top:52px;bottom:60px;left:0;right:0;overflow-y:auto;padding:32px 40px}
.eyebrow{font-size:11px;font-weight:600;color:#6c63ff;letter-spacing:2px;text-transform:uppercase}
.heading{font-size:36px;font-weight:800;color:white;letter-spacing:-1px;margin-top:8px}
.subtext{font-size:15px;color:#5a5f75;margin-top:8px;margin-bottom:28px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{padding:6px 16px;border-radius:99px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#5a5f75;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.chip.active{background:#6c63ff;border-color:#6c63ff;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#1a1d27;border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:22px;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:rgba(108,99,255,0.4)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.badge-india{background:rgba(255,171,0,0.1);color:#ffab00}
.badge-us{background:rgba(108,99,255,0.1);color:#8b84ff}
.card-source{font-size:12px;color:#5a5f75}
.card-headline{font-size:15px;font-weight:700;color:white;margin-top:10px;line-height:1.4}
.card-summary{font-size:13px;color:#8b90a7;margin-top:6px;line-height:1.6}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sector-tag{background:rgba(255,255,255,0.05);color:#5a5f75;font-size:11px;padding:3px 10px;border-radius:99px}
.bullish{font-size:12px;font-weight:600;color:#22c55e}
.bearish{font-size:12px;font-weight:600;color:#ef4444}
.neutral{font-size:12px;font-weight:600;color:#f59e0b}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5a5f75;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@media(max-width:800px){.main{padding:24px 18px}.grid{grid-template-columns:1fr}.heading{font-size:30px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-logo">StockSage AI</span>
  <span class="topbar-tag">Market News</span>
  <button onclick="logout()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#8b90a7;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s" onmouseover="this.style.color='white'" onmouseout="this.style.color='#8b90a7'">Sign out</button>
</div>
<div class="main">
  <div class="eyebrow">MARKET NEWS</div>
  <div class="heading">Market signals, without the noise.</div>
  <div class="subtext">Curated news from Indian and US markets with AI sentiment analysis.</div>
  <div class="filters">
    <button class="chip active" onclick="filterNews(this,'all')">All</button>
    <button class="chip" onclick="filterNews(this,'india')">India</button>
    <button class="chip" onclick="filterNews(this,'us')">US</button>
    <button class="chip" onclick="filterNews(this,'tech')">Tech</button>
    <button class="chip" onclick="filterNews(this,'banking')">Banking</button>
    <button class="chip" onclick="filterNews(this,'energy')">Energy</button>
    <button class="chip" onclick="filterNews(this,'auto')">Auto</button>
  </div>
  <div class="grid" id="news-grid"></div>
</div>
<div class="bottomnav">
  <a href="/chat" id="nav-research">📊<span>Research</span></a>
  <a href="/budget" id="nav-budget">💼<span>Budget</span></a>
  <a href="/news" id="nav-news" class="active">📰<span>News</span></a>
  <a href="/assistant" id="nav-assistant">🤖<span>Assistant</span></a>
  <a href="/profile" id="nav-profile">👤<span>Profile</span></a>
</div>
<script>
async function checkAuth(){
  try{
    const res = await fetch('/api/auth/me');
    if(!res.ok){ window.location.href='/login'; return null; }
    return await res.json();
  }catch(e){ window.location.href='/login'; return null; }
}

async function logout(){
  await fetch('/api/auth/logout', {method:'POST'});
  window.location.href = '/login';
}

let allNews = [];
let currentFilter = 'all';

function sentimentHTML(s){
  if(s==='Bullish') return '<span class="bullish">↑ Bullish</span>';
  if(s==='Bearish') return '<span class="bearish">↓ Bearish</span>';
  return '<span class="neutral">→ Neutral</span>';
}

function renderNews(filter){
  const grid = document.getElementById('news-grid');
  const filtered = filter === 'all' ? allNews : allNews.filter(n => n.market.toLowerCase() === filter || n.sector === filter);
  if(filtered.length === 0){
    grid.innerHTML = '<div style="color:#5a5f75;font-size:14px;text-align:center;padding:40px;grid-column:1/-1">No news found for this filter.</div>';
    return;
  }
  grid.innerHTML = filtered.map((n, i) => `
    <div class="card" onclick="openNews(${allNews.indexOf(n)})">
      <div class="card-top">
        <span class="badge ${n.market==='INDIA'?'badge-india':'badge-us'}">${n.market}</span>
        <span class="card-source">${n.source} · ${n.time}</span>
      </div>
      <div class="card-headline">${n.title}</div>
      <div class="card-summary">${n.summary}</div>
      <div class="card-bottom">
        <span class="sector-tag">${n.sector.charAt(0).toUpperCase()+n.sector.slice(1)}</span>
        ${sentimentHTML(n.sentiment)}
      </div>
    </div>`).join('');
}

function filterNews(el, filter){
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = filter;
  renderNews(filter);
}

function openNews(idx){
  const article = allNews[idx];
  if(article && article.url){
    window.open(article.url, '_blank');
  }
}

async function loadNews(){
  const grid = document.getElementById('news-grid');
  grid.innerHTML = '<div style="color:#5a5f75;font-size:14px;text-align:center;padding:40px;grid-column:1/-1">Loading latest market news...</div>';
  try{
    const res = await fetch('/api/live-news');
    const data = await res.json();
    if(data.success && data.articles.length > 0){
      allNews = data.articles;
      renderNews(currentFilter);
    } else {
      grid.innerHTML = '<div style="color:#5a5f75;font-size:14px;text-align:center;padding:40px;grid-column:1/-1">Could not load news. Please try again later.</div>';
    }
  }catch(e){
    grid.innerHTML = '<div style="color:#5a5f75;font-size:14px;text-align:center;padding:40px;grid-column:1/-1">Could not load news. Please try again later.</div>';
  }
}

checkAuth().then(() => loadNews());
</script>
<div id="chat-bubble" onmousedown="startDrag(event)" onclick="toggleChatBubble()" style="position:fixed;bottom:76px;right:20px;background:#6c63ff;border-radius:99px;display:flex;align-items:center;gap:8px;cursor:grab;z-index:300;box-shadow:0 4px 20px rgba(108,99,255,0.35);padding:12px 18px;user-select:none;transition:box-shadow .2s">
  <span style="font-size:16px;pointer-events:none">🤖</span>
  <span id="bubble-label" style="font-size:13px;font-weight:600;color:white;white-space:nowrap;pointer-events:none">Ask StockSage</span>
</div>

<div id="chat-popup" style="display:none;position:fixed;bottom:140px;right:20px;width:360px;height:460px;background:#1a1d27;border:1px solid rgba(255,255,255,0.1);border-radius:20px;z-index:300;display:none;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5)">
  <div style="padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:14px;font-weight:700;color:white">StockSage Assistant</div>
      <div style="font-size:11px;color:#5a5f75;margin-top:2px">Ask me anything about markets</div>
    </div>
    <button onclick="toggleChatBubble()" style="background:rgba(255,255,255,0.06);border:none;color:#8b90a7;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>
  </div>
  <div id="bubble-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px"></div>
  <div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px">
    <input id="bubble-input" type="text" placeholder="Ask about any stock or market..." style="flex:1;background:#22263a;color:white;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;font-size:13px;outline:none;font-family:'Inter',sans-serif" onkeydown="if(event.key==='Enter')sendBubbleMsg()" />
    <button onclick="sendBubbleMsg()" style="background:#6c63ff;color:white;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer">→</button>
  </div>
</div>
</body>
</html>

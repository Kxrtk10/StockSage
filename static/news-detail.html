<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSage AI - News Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#f0f2ff;font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#1a1d27;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.topbar-logo{font-size:16px;font-weight:700;color:white}
.topbar-tag{font-size:12px;color:#5a5f75}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#1a1d27;border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:100}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#5a5f75;text-decoration:none;transition:color .15s}
.bottomnav a.active{color:#6c63ff}
.bottomnav .icon{font-size:16px;line-height:1}
.main{position:fixed;top:52px;bottom:60px;left:0;right:0;overflow-y:auto;padding:40px 120px;background:#0f1117}
.back{margin-bottom:28px;padding:0;border:none;background:none;color:#5a5f75;cursor:pointer;font-size:14px;font-family:'Inter',system-ui,sans-serif}
.badges-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.badge,.sector-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.badge-india{background:rgba(255,171,0,0.1);color:#ffab00}
.badge-us{background:rgba(108,99,255,0.1);color:#8b84ff}
.sector-tag{background:rgba(255,255,255,0.05);color:#5a5f75}
.bullish{font-size:13px;font-weight:600;color:#22c55e}
.bearish{font-size:13px;font-weight:600;color:#ef4444}
.neutral{font-size:13px;font-weight:600;color:#f59e0b}
h1{max-width:940px;margin-bottom:12px;color:white;font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.18}
.meta{margin-bottom:24px;color:#5a5f75;font-size:14px}
.summary{max-width:780px;margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid rgba(255,255,255,0.06);color:#8b90a7;font-size:18px;line-height:1.85}
.analysis-label{margin-bottom:16px;color:#6c63ff;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
#analysis-content{max-width:820px;color:#e8eaf0;font-size:18px;line-height:2}
#analysis-content strong{color:white;font-weight:800}
.analysis-heading{margin:26px 0 12px;color:white;font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.35}
.analysis-heading:first-child{margin-top:0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5a5f75;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
#chat-bubble{position:relative}
#chat-bubble::before{content:'';position:absolute;inset:0;border-radius:99px;background:#6c63ff;animation:pulse-ring 2s infinite;z-index:-1;opacity:0.4}
@keyframes pulse-ring{0%{transform:scale(1);opacity:0.4}100%{transform:scale(1.4);opacity:0}}
@media(max-width:900px){.main{padding:28px 22px}h1{font-size:34px}.summary{font-size:16px}#analysis-content{font-size:16px}.analysis-heading{font-size:20px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-logo">StockSage AI</span>
  <span class="topbar-tag">Market News</span>
</div>
<main class="main">
  <button class="back" onclick="window.history.back()">← Back to News</button>
  <div class="badges-row" id="badges-row"></div>
  <h1 id="headline"></h1>
  <div class="meta" id="meta"></div>
  <p class="summary" id="summary"></p>
  <section>
    <div class="analysis-label">AI ANALYSIS</div>
    <div id="analysis-content"></div>
  </section>
</main>
<div class="bottomnav">
  <a href="/chat"><span class="icon">📊</span><span>Research</span></a>
  <a href="/budget"><span class="icon">💼</span><span>Budget</span></a>
  <a href="/news" class="active"><span class="icon">📰</span><span>News</span></a>
</div>
<script>
const NEWS=[
  {market:"INDIA",sector:"banking",source:"Economic Times",time:"2h ago",headline:"RBI holds repo rate steady at 6.5% signalling confidence in inflation control",summary:"The Monetary Policy Committee voted unanimously to maintain rates, citing stable CPI and resilient GDP growth. Analysts see this as a green signal for rate-sensitive sectors.",sentiment:"Neutral"},
  {market:"US",sector:"tech",source:"Bloomberg",time:"3h ago",headline:"NVIDIA crosses $3 trillion market cap on record AI chip demand",summary:"Strong data center revenue and sustained H100 demand pushed NVIDIA to a historic milestone, briefly overtaking Microsoft as the world's most valuable company.",sentiment:"Bullish"},
  {market:"INDIA",sector:"energy",source:"Mint",time:"4h ago",headline:"Adani Green Energy secures Rs 12000 crore renewable project in Rajasthan",summary:"The deal adds 1.5 GW to Adani's solar pipeline and cements its position as India's largest renewable energy company by installed capacity.",sentiment:"Bullish"},
  {market:"US",sector:"banking",source:"Reuters",time:"5h ago",headline:"Fed signals two rate cuts possible in second half of 2025 if inflation cools",summary:"Federal Reserve minutes revealed a dovish tilt among members, with 50 basis points of cuts seen as realistic if CPI continues its downward trend through Q2.",sentiment:"Bullish"},
  {market:"INDIA",sector:"tech",source:"NDTV Profit",time:"6h ago",headline:"Infosys raises FY25 revenue guidance on back of record deal pipeline",summary:"The IT major upgraded its constant currency growth forecast to 4.5 to 5 percent, driven by a record deal total contract value of 9.4 billion dollars.",sentiment:"Bullish"},
  {market:"US",sector:"energy",source:"WSJ",time:"7h ago",headline:"Oil prices fall as OPEC signals possible output increase in Q3 2025",summary:"Crude futures dropped 1.8 percent after sources indicated Saudi Arabia may ease supply curbs if Chinese demand data remains weak through the summer.",sentiment:"Bearish"},
  {market:"INDIA",sector:"auto",source:"Business Standard",time:"8h ago",headline:"Tata Motors EV sales surge 38 percent in May driven by Nexon and Punch",summary:"Strong domestic EV demand and new model launches helped Tata Motors maintain over 70 percent market share in Indian electric passenger vehicles.",sentiment:"Bullish"},
  {market:"US",sector:"tech",source:"CNBC",time:"9h ago",headline:"Apple Intelligence features drive record iPhone upgrade cycle in emerging markets",summary:"Apple reported stronger than expected emerging market growth with AI-powered features cited as the primary driver of upgrades in India, Brazil, and Southeast Asia.",sentiment:"Bullish"}
];
function sentimentHTML(s){
  if(s==="Bullish")return'<span class="bullish">↑ Bullish</span>';
  if(s==="Bearish")return'<span class="bearish">↓ Bearish</span>';
  return'<span class="neutral">→ Neutral</span>';
}
function loadingDots(){
  return '<div style="display:flex;gap:6px;align-items:center;color:#5a5f75;font-size:13px"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:4px">Analysing this for you...</span></div>';
}
async function analyseNews(n){
  const analysis=document.getElementById('analysis-content');
  analysis.innerHTML=loadingDots();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Analyse this market news for a retail investor and explain it in simple terms:\n\nHeadline: ${n.headline}\n\nSummary: ${n.summary}\n\nPlease cover:\n1. What this news actually means in plain English\n2. How this affects the stock market — which sectors or stocks go up or down and why\n3. What should a retail investor do or watch out for because of this news\n4. Overall sentiment — is this good or bad for investors and why\n\nKeep it concise, use simple language, be direct and encouraging. Use emojis where helpful. Use arrow symbol for key points.`})});
    const data=await res.json();
    const formatted=data.response
      .replace(/^#{1,6}\s*(.*?)$/gm,'<div class="analysis-heading">$1</div>')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/→/g,'<br><br>→')
      .replace(/\n\n/g,'<br><br>')
      .replace(/\n/g,'<br>')
      .replace(/^(<br>)+/,'')
      .replace(/<br><div class="analysis-heading">/g,'<div class="analysis-heading">');
    analysis.innerHTML=formatted;
  }catch(e){
    analysis.innerHTML='<div style="color:#ef4444;font-size:13px">Could not load analysis. Please try again.</div>';
  }
}
function loadNewsDetail(){
  const idx=Number(new URLSearchParams(window.location.search).get('idx') || 0);
  const n=NEWS[idx];
  if(!n){
    document.getElementById('headline').textContent='News item not found';
    document.getElementById('analysis-content').textContent='Go back and choose another story.';
    return;
  }
  document.getElementById('badges-row').innerHTML=`
    <span class="badge ${n.market==='INDIA'?'badge-india':'badge-us'}">${n.market}</span>
    <span class="sector-tag">${n.sector.charAt(0).toUpperCase()+n.sector.slice(1)}</span>
    ${sentimentHTML(n.sentiment)}`;
  document.getElementById('headline').textContent=n.headline;
  document.getElementById('meta').textContent=n.source+' · '+n.time;
  document.getElementById('summary').textContent=n.summary;
  analyseNews(n);
}
let bubbleOpen = false;
const BUBBLE_KEY = 'stocksage_bubble_msgs';

function saveBubbleMsgs(){
  const msgs = document.getElementById('bubble-messages');
  const items = [];
  msgs.querySelectorAll('[data-role]').forEach(el => {
    items.push({role: el.dataset.role, text: el.dataset.text});
  });
  sessionStorage.setItem(BUBBLE_KEY, JSON.stringify(items));
}

function loadBubbleMsgs(){
  const saved = sessionStorage.getItem(BUBBLE_KEY);
  if(!saved) return false;
  const items = JSON.parse(saved);
  if(items.length === 0) return false;
  items.forEach(item => addBubbleMsg(item.role, item.text, false));
  return true;
}

function toggleChatBubble(){
  bubbleOpen = !bubbleOpen;
  const popup = document.getElementById('chat-popup');
  const label = document.getElementById('bubble-label');
  const bubble = document.getElementById('chat-bubble');
  popup.style.display = bubbleOpen ? 'flex' : 'none';
  if(bubbleOpen){
    if(label) label.style.display = 'none';
    bubble.style.padding = '14px';
    const msgs = document.getElementById('bubble-messages');
    if(msgs.children.length === 0){
      const loaded = loadBubbleMsgs();
      if(!loaded){
        addBubbleMsg('ai', "Hey! 👋 Got questions about stocks, markets, or investing? Ask me anything and I'll explain it clearly.", true);
      }
    }
    msgs.scrollTop = msgs.scrollHeight;
  } else {
    if(label) label.style.display = 'block';
    bubble.style.padding = '14px 20px';
  }
}

function addBubbleMsg(role, text, save=true){
  const msgs = document.getElementById('bubble-messages');
  const div = document.createElement('div');
  div.dataset.role = role;
  div.dataset.text = text;
  div.style.cssText = `display:flex;gap:8px;align-items:flex-start;${role==='user'?'flex-direction:row-reverse':''}`;
  div.innerHTML = `
    <div style="width:28px;height:28px;border-radius:50%;background:${role==='ai'?'rgba(108,99,255,0.2)':'#22263a'};color:${role==='ai'?'#8b84ff':'#8b90a7'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${role==='ai'?'SS':'You'}</div>
    <div style="max-width:80%;padding:10px 13px;font-size:13px;line-height:1.6;color:#e8eaf0;border-radius:${role==='ai'?'4px 12px 12px 12px':'12px 4px 12px 12px'};background:${role==='ai'?'rgba(255,255,255,0.04)':'rgba(108,99,255,0.12)'};border:1px solid ${role==='ai'?'rgba(255,255,255,0.06)':'rgba(108,99,255,0.2)'}">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  if(save) saveBubbleMsgs();
}

function showBubbleTyping(){
  const msgs = document.getElementById('bubble-messages');
  const div = document.createElement('div');
  div.id = 'bubble-typing';
  div.style.cssText = 'display:flex;gap:8px;align-items:flex-start';
  div.innerHTML = `<div style="width:28px;height:28px;border-radius:50%;background:rgba(108,99,255,0.2);color:#8b84ff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">SS</div><div style="padding:10px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:4px 12px 12px 12px;display:flex;gap:4px;align-items:center"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideBubbleTyping(){
  const t = document.getElementById('bubble-typing');
  if(t) t.remove();
}

async function sendBubbleMsg(){
  const input = document.getElementById('bubble-input');
  const text = input.value.trim();
  if(!text) return;
  addBubbleMsg('user', text, true);
  input.value = '';
  showBubbleTyping();
  try{
    const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: text})});
    const data = await res.json();
    hideBubbleTyping();
    const formatted = data.response
      .replace(/^#{1,3}\s+/gm,'')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/→/g,'<br>→')
      .replace(/\n/g,'<br>');
    addBubbleMsg('ai', formatted, true);
  }catch(e){
    hideBubbleTyping();
    addBubbleMsg('ai', 'Something went wrong. Please try again.', true);
  }
}
loadNewsDetail();
</script>
<div id="chat-bubble" onclick="toggleChatBubble()" style="position:fixed;bottom:76px;right:20px;background:#6c63ff;border-radius:99px;display:flex;align-items:center;gap:8px;cursor:pointer;z-index:300;box-shadow:0 4px 24px rgba(108,99,255,0.5);transition:all .3s;padding:14px 20px">
  <span style="font-size:18px">💬</span>
  <span id="bubble-label" style="font-size:13px;font-weight:700;color:white;white-space:nowrap">Ask StockSage</span>
</div>
<div id="chat-popup" style="display:none;position:fixed;bottom:140px;right:20px;width:360px;height:460px;background:#1a1d27;border:1px solid rgba(255,255,255,0.1);border-radius:20px;z-index:300;display:none;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5)">
  <div style="padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:14px;font-weight:700;color:white">StockSage Assistant</div>
      <div style="font-size:11px;color:#5a5f75;margin-top:2px">Ask me anything about markets</div>
    </div>
    <button onclick="toggleChatBubble()" style="background:rgba(255,255,255,0.06);border:none;color:#8b90a7;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>
  </div>
  <div id="bubble-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px"></div>
  <div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px">
    <input id="bubble-input" type="text" placeholder="Ask about any stock or market..." style="flex:1;background:#22263a;color:white;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;font-size:13px;outline:none;font-family:'Inter',sans-serif" onkeydown="if(event.key==='Enter')sendBubbleMsg()" />
    <button onclick="sendBubbleMsg()" style="background:#6c63ff;color:white;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer">→</button>
  </div>
</div>
</body>
</html>
